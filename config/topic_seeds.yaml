# 주제 발굴 시드 — `autoblog rank discover`(인자 없이)가 읽는다.
# base는 항상 포함, monthly는 실행하는 달의 것만 합쳐진다. 자유롭게 수정하세요.
# 시드는 '정답 주제'가 아니라 출발점 — 연관 키워드로 확장한 뒤 실제 검색량/문서수로
# 걸러지므로, 시드가 어긋나도 약한 후보가 뜰 뿐 잘못된 주제가 나오진 않는다.

base:
  # 프랜차이즈·편의점 (월간 갱신형 — 행사·메뉴·시간이 매달 리셋)
  - 버거킹 메뉴
  - 맥도날드 메뉴
  - 롯데리아 메뉴
  - 메가커피 메뉴
  - 스타벅스 신메뉴
  - 투썸 케이크
  - 빽다방 메뉴
  - 편의점 신상
  # 상시 정보성 패턴
  - 계란 보관법
  - 냉동실 정리

monthly:
  1: [귤 보관법, 떡국, 다이어트 식단]
  2: [딸기 제철, 밸런타인 초콜릿]
  3: [봄나물, 딸기 보관법]
  4: [주꾸미 제철, 봄소풍 도시락]
  5: [참외 제철, 수박 고르는 법]
  6: [초당옥수수, 자두 제철, 매실청]
  7: [복숭아 보관법, 옥수수 삶는법, 삼계탕]
  8: [무화과, 복숭아 보관법, 포도 제철, 말복 음식]
  9: [샤인머스캣, 추석 음식, 전어 제철, 배 보관법]
  10: [고구마 보관법, 밤 삶는법, 대하 제철]
  11: [수능 도시락, 김장, 귤 제철]
  12: [크리스마스 케이크, 붕어빵, 굴 제철]
